		<style>
		.flagship-hero-slider-wrapper {
			position: relative;
		}
		.flagship-hero-slider-wrapper .wp-block-post-template {
			display: flex !important;
			flex-wrap: nowrap !important;
			overflow-x: auto;
			scroll-snap-type: x mandatory;
			gap: 0 !important;
			scrollbar-width: none; /* Firefox */
			scroll-behavior: smooth;
		}
		.flagship-hero-slider-wrapper .wp-block-post-template::-webkit-scrollbar {
			display: none; /* Chrome/Safari */
		}
		.flagship-hero-slider-wrapper .wp-block-post-template > li {
			flex: 0 0 100% !important;
			scroll-snap-align: center;
			position: relative;
		}
		.flagship-hero-slider-wrapper .wp-block-post-featured-image {
			margin-bottom: 0 !important;
		}
		.flagship-hero-slider-wrapper .wp-block-post-featured-image img {
			width: 100%;
			height: auto;
			display: block;
			border-radius: 0 !important;
		}
		.flagship-carousel-caption .wp-block-post-title {
			margin: 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.flagship-carousel-caption .wp-block-post-title a {
			color: #ffffff !important;
		}
		.carousel-nav button {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			background: transparent;
			color: white;
			border: none;
			padding: 10px;
			cursor: pointer;
			z-index: 10;
			font-size: 36px;
			text-shadow: 0 2px 4px rgba(0,0,0,0.5);
			opacity: 0.8;
			transition: opacity 0.3s;
		}
		.carousel-nav button:hover { opacity: 1; }
		.carousel-prev { left: 10px; }
		.carousel-next { right: 10px; }
		.carousel-dots {
			position: absolute;
			bottom: 10px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 8px;
			z-index: 10;
		}
		.carousel-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: rgba(255,255,255,0.5);
			cursor: pointer;
		}
		.carousel-dot.active {
			background: white;
		}
		</style>
		<script>
		document.addEventListener('DOMContentLoaded', () => {
			const wrapper = document.querySelector('.flagship-hero-slider-wrapper');
			if (!wrapper) return;
			const scroller = wrapper.querySelector('.wp-block-post-template');
			const dotsContainer = wrapper.querySelector('.carousel-dots');
			
			// wait for FSE to render inner blocks
			setTimeout(() => {
				const slides = Array.from(scroller.querySelectorAll('li'));
				if(slides.length === 0) return;

				slides.forEach((_, i) => {
					const dot = document.createElement('div');
					dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
					dot.addEventListener('click', () => {
						scroller.scrollTo({ left: scroller.clientWidth * i, behavior: 'smooth' });
					});
					dotsContainer.appendChild(dot);
				});

				const updateDots = () => {
					const index = Math.round(scroller.scrollLeft / scroller.clientWidth);
					wrapper.querySelectorAll('.carousel-dot').forEach((d, i) => {
						d.classList.toggle('active', i === index);
					});
				};
				scroller.addEventListener('scroll', updateDots);

				wrapper.querySelector('.carousel-prev').addEventListener('click', () => {
					scroller.scrollBy({ left: -scroller.clientWidth, behavior: 'smooth' });
				});
				wrapper.querySelector('.carousel-next').addEventListener('click', () => {
					scroller.scrollBy({ left: scroller.clientWidth, behavior: 'smooth' });
				});
			}, 500);
		});
		</script>
		<!-- /wp:html -->
